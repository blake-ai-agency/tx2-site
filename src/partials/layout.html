<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#0b0c0e">
<meta name="robots" content="{{{robots}}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
{{{preload}}}
<link rel="stylesheet" href="/css/site.css?v={{assetVer}}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "LocalBusiness",
      "@id": "{{url}}/#business",
      "name": "{{name}}",
      "url": "{{url}}/",
      "telephone": "{{phoneTel}}",
      "image": "{{url}}/img/og-image.jpg",
      "logo": "{{url}}/img/icon-512.png",
      "description": "{{tagline}}",
      "priceRange": "$$",
      "address": { "@type": "PostalAddress", "streetAddress": "{{street}}", "addressLocality": "{{city}}", "addressRegion": "{{state}}", "postalCode": "{{zip}}", "addressCountry": "US" },
      "geo": { "@type": "GeoCoordinates", "latitude": 38.4501, "longitude": -91.0088 },
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "Franklin County, MO" },
        { "@type": "City", "name": "Union, MO" }, { "@type": "City", "name": "Washington, MO" }, { "@type": "City", "name": "St. Clair, MO" },
        { "@type": "City", "name": "Pacific, MO" }, { "@type": "City", "name": "Sullivan, MO" }, { "@type": "City", "name": "Eureka, MO" },
        { "@type": "City", "name": "Hermann, MO" }, { "@type": "City", "name": "Warrenton, MO" }, { "@type": "City", "name": "Wentzville, MO" },
        { "@type": "City", "name": "St. Charles, MO" }, { "@type": "City", "name": "St. Peters, MO" }, { "@type": "City", "name": "Chesterfield, MO" },
        { "@type": "City", "name": "Fenton, MO" }, { "@type": "City", "name": "Troy, MO" }, { "@type": "City", "name": "Cuba, MO" }, { "@type": "City", "name": "Potosi, MO" }
      ],
      "sameAs": ["{{facebook}}", "{{googleMapsUrl}}"],
      "hasMap": "{{googleMapsUrl}}",
      "hasOfferCatalog": {
        "@type": "OfferCatalog", "name": "Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Dumpster Rental", "url": "{{url}}/dumpster-rental" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Junk Removal", "url": "{{url}}/junk-removal" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Property Maintenance", "url": "{{url}}/property-maintenance" } }
        ]
      }
    },
    { "@type": "WebSite", "@id": "{{url}}/#website", "url": "{{url}}/", "name": "{{name}}", "publisher": { "@id": "{{url}}/#business" } }
    {{{breadcrumbSchema}}}
    {{{schemaExtra}}}
  ]
}
</script>
</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="nav-sentinel" aria-hidden="true"></div>
{{> nav}}
<main id="main">
{{{content}}}
</main>
{{> footer}}
<div class="sticky-cta" aria-label="Quick actions">
  <a class="btn btn--primary" href="tel:{{phoneTel}}">Call {{phone}}</a>
  <a class="btn" href="/contact">Get a quote</a>
</div>
<script src="/js/site.js?v={{assetVer}}" defer></script>
{{{scripts}}}
</body>
</html>
